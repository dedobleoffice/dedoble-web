<script>
/* Hold the page until Inter Tight has loaded, so the name never shows in a stand-in face first.
   This sits after the font stylesheet, which the browser loads before running it. */
(function(){
  var d = document.documentElement; d.className += ' wf';
  var show = function(){ d.className = d.className.replace(' wf', ''); };
  setTimeout(show, 2500);
  try { Promise.all([document.fonts.load('800 1em "Inter Tight"'), document.fonts.load('400 1em "Inter Tight"')]).then(show, show); } catch (e) { show(); }
})();
</script>
<style>
/* VOICE: the dedoble home with the lights off: black, the name, nothing to navigate yet.
   IDEA: a sign on a closed door. The name alone carries the page; one point breathes beside "Coming soon".
   PICTURE: the name itself, a quarter of the screen width at every size.
   COLOUR and TYPE: white on black until the full (white) site opens; Inter Tight 800 for the name, one grey for the quiet line.
   LAYOUT: the name across the middle; one centred line at the foot ends in Instagram. */
:root { color-scheme: dark; --grey: #9a9a9a; }
*, *::before, *::after { box-sizing: border-box; }
html { background: #000; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #000; color: #fff; font: 18px/1.4 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; overflow: hidden; animation: page-in .6s ease both; }
::selection { background: #fff; color: #000; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
img { display: block; }
@keyframes page-in { from { opacity: 0; } }
.wf body { visibility: hidden; animation: none; }
.wf .foot { animation: none; }
@keyframes fade-in { to { opacity: 1; } }

/* The page: one screen, nothing to scroll */
.soon { --name: 25vw; position: relative; isolation: isolate; height: 100vh; height: 100svh; display: grid; place-items: center; overflow: hidden; background: #000; }

/* The name */
.name { position: absolute; left: 0; right: 0; top: 50%; z-index: 3; margin: 0 0 0 -.09em; transform: translateY(-50%);
  font-weight: 800; font-size: var(--name); line-height: 1; letter-spacing: -.09em; font-synthesis: none;
  text-align: center; white-space: nowrap; color: #fff; pointer-events: none; }

/* Instagram: the one thing to do for now */
.ig { color: #fff; }
.ig span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: rgba(255,255,255,.35); transition: text-decoration-color .3s ease; }
.ig:hover span, .ig:focus-visible span { text-decoration-color: currentColor; }

/* The foot: three lines, each on the centre line */
.foot { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 3; display: flex; justify-content: center; align-items: center;
  flex-direction: column; gap: 6px; text-align: center; padding: 0 20px; margin: 0; font-size: 15px; color: var(--grey);
  opacity: 0; animation: fade-in 1s ease 1.2s forwards; }
.status { position: relative; color: #fff; }
.status::before { content: ""; position: absolute; right: calc(100% + 9px); top: 50%; margin-top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: breathe 3.6s ease-in-out .8s infinite; }
@keyframes breathe { 0%, 55%, 100% { transform: scale(1); } 22% { transform: scale(1.6); } }

/* The cursor: a small point in negative, as on the full site (mouse only) */
.dot { position: fixed; left: 0; top: 0; z-index: 50; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: #fff; mix-blend-mode: difference; pointer-events: none; opacity: 0;
  transition: width .3s ease, height .3s ease, margin .3s ease, opacity .3s ease; }
.dot.on { opacity: 1; }
.dot.big { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
@media (hover: hover) and (pointer: fine) { html.has-dot, html.has-dot * { cursor: none !important; } }

/* Sizes */
@media (max-width: 809.98px) {
  .foot { bottom: 22px; gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  body, .foot { animation: none; opacity: 1; }
  .status::before { animation: none; }
}
</style>
</head>
<body>
<main class="soon">
  <h1 class="name">dedoble</h1>
  <p class="foot">
    <span>Architecture office – Barcelona</span>
    <span class="status">Coming soon</span>
    <a class="ig" href="https://www.instagram.com/dedoble.office/" target="_blank" rel="noopener" aria-label="Follow dedoble on Instagram, @dedoble.office">
      <span>@dedoble.office</span>
    </a>
  </p>
</main>
<script>
{
  // The cursor: a small point in negative that grows over the link (mouse only)
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    document.body.append(dot);
    document.documentElement.classList.add('has-dot');
    addEventListener('pointermove', e => {
      dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      dot.classList.add('on');
      dot.classList.toggle('big', !!e.target.closest('a'));
    });
    document.addEventListener('pointerleave', () => dot.classList.remove('on'));
  }
}
</script>
